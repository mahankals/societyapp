# Docker Compose - Production
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: societyapp-prod
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-https://societyapp.com}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-societyapp}
      - DB_USER=${DB_USER:-societyapp}
      - DB_PASS=${DB_PASS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - societyapp-prod

  db:
    image: mysql:8.0
    container_name: societyapp-prod-db
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS:-}
      - MYSQL_DATABASE=${DB_NAME:-societyapp}
      - MYSQL_USER=${DB_USER:-societyapp}
      - MYSQL_PASSWORD=${DB_PASS:-}
    volumes:
      - db-data-prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - societyapp-prod

volumes:
  db-data-prod:

networks:
  societyapp-prod:
    driver: bridge
